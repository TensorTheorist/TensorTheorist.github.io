<text x="560.0" y="56.0" fill="#7c3aed" font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle" font-weight="600">analyticity</text>
<line x1="149.0" y1="51.0" x2="171.0" y2="51.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="309.0" y1="51.0" x2="331.0" y2="51.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="469.0" y1="51.0" x2="491.0" y2="51.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow)"/><text x="80.0" y="96" fill="#2b2545" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" font-weight="normal">lim  f(x) = L</text>
<text x="80.0" y="112" fill="#6b5b95" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle" font-weight="normal">as x → x₀</text>
<text x="240.0" y="96" fill="#2b2545" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" font-weight="normal">lim  f′(x)  matches</text>
<text x="240.0" y="112" fill="#6b5b95" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle" font-weight="normal">from both sides</text>
<text x="400.0" y="96" fill="#2b2545" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle" font-weight="normal">every  f⁽ⁿ⁾(x)</text>
<text x="400.0" y="112" fill="#6b5b95" font-family="JetBrains Mono, monospace" font-size="10" text-anchor="middle" font-weight="normal">exists and matches</text>
