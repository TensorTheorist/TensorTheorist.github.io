<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Prime counting function pi(x) vs x/log(x)">
  <rect width="600" height="320" fill="#0e1220"/>
  <!-- axes -->
  <line x1="50" y1="280" x2="570" y2="280" stroke="#4a5578" stroke-width="1"/>
  <line x1="50" y1="20" x2="50" y2="280" stroke="#4a5578" stroke-width="1"/>
  <text x="560" y="298" fill="#9aa4c7" font-family="JetBrains Mono, monospace" font-size="12">x</text>
  <text x="20" y="30" fill="#9aa4c7" font-family="JetBrains Mono, monospace" font-size="12">y</text>
  <!-- pi(x) staircase -->
  <polyline fill="none" stroke="#ffd166" stroke-width="2"
    points="50,280 90,280 90,260 140,260 140,240 190,240 190,220 230,220 230,200 280,200 280,180 320,180 320,160 370,160 370,140 420,140 420,120 470,120 470,100 520,100 520,80 570,80"/>
  <!-- x / log(x) smooth -->
  <path d="M50,280 Q200,200 400,120 T570,60" fill="none" stroke="#7c9cff" stroke-width="2"/>
  <!-- Li(x) even closer -->
  <path d="M50,280 Q220,190 420,110 T570,55" fill="none" stroke="#ff7ea8" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- legend -->
  <rect x="380" y="220" width="14" height="14" fill="#ffd166"/>
  <text x="400" y="232" fill="#9aa4c7" font-family="JetBrains Mono, monospace" font-size="12">π(x) — prime count</text>
  <rect x="380" y="242" width="14" height="14" fill="#7c9cff"/>
  <text x="400" y="254" fill="#9aa4c7" font-family="JetBrains Mono, monospace" font-size="12">x / log(x)</text>
  <rect x="380" y="264" width="14" height="14" fill="#ff7ea8"/>
  <text x="400" y="276" fill="#9aa4c7" font-family="JetBrains Mono, monospace" font-size="12">Li(x)</text>
</svg>
