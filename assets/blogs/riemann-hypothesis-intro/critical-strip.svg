<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="The critical strip of the Riemann zeta function">
  <defs>
    <linearGradient id="strip" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7c9cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c9cff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" fill="#0e1220"/>
  <!-- axes -->
  <line x1="40" y1="160" x2="560" y2="160" stroke="#4a5578" stroke-width="1"/>
  <line x1="300" y1="20" x2="300" y2="300" stroke="#4a5578" stroke-width="1"/>
  <text x="555" y="180" fill="#9aa4c7" font-family="JetBrains Mono, monospace" font-size="12">Re(s)</text>
  <text x="308" y="28" fill="#9aa4c7" font-family="JetBrains Mono, monospace" font-size="12">Im(s)</text>
  <!-- critical strip 0 < Re(s) < 1 -->
  <rect x="300" y="20" width="120" height="280" fill="url(#strip)"/>
  <!-- critical line Re(s) = 1/2 -->
  <line x1="360" y1="20" x2="360" y2="300" stroke="#ff7ea8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="366" y="36" fill="#ff7ea8" font-family="JetBrains Mono, monospace" font-size="12">Re(s) = 1/2</text>
  <!-- non-trivial zeros on the critical line (illustrative) -->
  <circle cx="360" cy="80" r="4" fill="#ffd166"/>
  <circle cx="360" cy="110" r="4" fill="#ffd166"/>
  <circle cx="360" cy="140" r="4" fill="#ffd166"/>
  <circle cx="360" cy="180" r="4" fill="#ffd166"/>
  <circle cx="360" cy="210" r="4" fill="#ffd166"/>
  <circle cx="360" cy="240" r="4" fill="#ffd166"/>
  <!-- trivial zeros on negative real axis -->
  <circle cx="260" cy="160" r="3" fill="#9aa4c7"/>
  <circle cx="220" cy="160" r="3" fill="#9aa4c7"/>
  <circle cx="180" cy="160" r="3" fill="#9aa4c7"/>
  <text x="150" y="184" fill="#9aa4c7" font-family="JetBrains Mono, monospace" font-size="11">trivial zeros: -2, -4, -6...</text>
  <!-- labels -->
  <text x="300" y="316" fill="#9aa4c7" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">0                     1</text>
  <text x="420" y="316" fill="#7c9cff" font-family="JetBrains Mono, monospace" font-size="11">critical strip</text>
</svg>
